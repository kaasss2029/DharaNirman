services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ulpin
      POSTGRES_USER: ulpin
      POSTGRES_PASSWORD: ulpin
    ports:
      - "5432:5432"
    volumes:
      - ulpin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulpin -d ulpin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ulpin:ulpin@db:5432/ulpin
      CORS_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend-storage:/app/storage

volumes:
  ulpin-postgres:
  backend-storage:
