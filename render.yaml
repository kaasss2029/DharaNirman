services:
  # 1. Backend Web Service (FastAPI + Docker)
  - type: web
    name: dharanirman-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dharanirman-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 480
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /app/storage

  # 2. Frontend Static Site
  - type: web
    name: dharanirman-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: "."

databases:
  # 3. PostgreSQL Database with PostGIS capability
  - name: dharanirman-db
    plan: free
    databaseName: ulpin
    user: ulpin
